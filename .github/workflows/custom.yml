name: Custom Build

on:
  workflow_dispatch:
    inputs:
      build_args:
        description: 'Extra args for build.py (optional)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  custom-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: './requirements.txt'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run custom script (auto-config)
        run: |
          config_file="config.json"
          build_args="--archive"

          # Include Chinese build if enabled
          if jq -e '.cn.enable' "$config_file" >/dev/null; then
            build_args="$build_args --cn"
          fi

          # Disable ligatures if false
          if jq -e '.enable_ligature' "$config_file" | grep -q false; then
            build_args="$build_args --no-liga"
          fi

          # Disable hinting if false
          if jq -e '.use_hinted' "$config_file" | grep -q false; then
            build_args="$build_args --no-hinted"
          fi

          # Enable Nerd Font mono if true
          if jq -e '.nerd_font.mono' "$config_file" | grep -q true; then
            build_args="$build_args --nf-mono"
          fi

          # Extract enabled features
          enabled_feats=$(jq -r '.feature_freeze | to_entries | map(select(.value == "enable")) | map(.key) | join(",")' "$config_file")
          if [ -n "$enabled_feats" ]; then
            build_args="$build_args --feat $enabled_feats"
          fi

          # Append any manual build args
          if [ -n "${{ github.event.inputs.build_args }}" ]; then
            build_args="$build_args ${{ github.event.inputs.build_args }}"
          fi

          echo "BUILD_ARGS=$build_args" >> $GITHUB_ENV
          python build.py $build_args
        continue-on-error: true

      - id: check_issue
        name: Check issue feature file
        run: |
          if [ -f fonts/issue.fea ]; then
            echo 'exists=true' >> $GITHUB_OUTPUT
          else
            echo 'exists=false' >> $GITHUB_OUTPUT
          fi

      - name: Upload issue artifact
        if: ${{ steps.check_issue.outputs.exists == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: issue-fea-file
          path: fonts/issue.fea

      - name: Create release
        run: |
          if [ ! -d "fonts/archive" ]; then
            echo "Error: Failed to build font, please check [Run custom script] step."
            exit 1
          fi
          echo "### Build arguments" >> NOTES
          echo "\`\`\`" >> NOTES
          echo "python build.py $BUILD_ARGS" >> NOTES
          echo "\`\`\`" >> NOTES
          echo "### Final Configuration" >> NOTES
          echo "\`\`\`" >> NOTES
          python build.py $BUILD_ARGS --dry | sed '1s/^/font_config: /' >> NOTES
          echo "\`\`\`" >> NOTES
          gh release create "v$(date +%s)" fonts/archive/*.* --notes-file NOTES
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
